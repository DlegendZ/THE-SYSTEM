name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: the-system/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: the-system
        run: npm ci

      - name: Fix Gradle Java configuration
        working-directory: the-system/android
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          chmod +x gradlew

      - name: Build release APK
        working-directory: the-system/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-SYSTEM-release
          path: the-system/android/app/build/outputs/apk/release/app-release.apk